# Lint + secret scanning. Local enforcement: .git/hooks/pre-commit
# (calls these tools directly to bypass the pre-commit framework's
# Python 3.14 / libexpat issue on macOS Tahoe). This file documents
# the canonical toolchain for CI and future framework re-enablement.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [html, javascript, css, json, markdown, yaml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict
