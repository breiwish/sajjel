[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["frontend", "backend", "recordings", ".venv"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade,
# B = bugbear, SIM = simplify, RUF = ruff-specific
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",  # line too long — formatter handles
  "B008",  # function calls in defaults (FastAPI pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
